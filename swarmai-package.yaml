# Runtime metadata read by the SwarmAI plugin loader.
# Cross-validated against the `@swarmai/meeting-bridge` manifest.yaml that
# lives under packages/official/meeting-bridge/ in the SwarmAI Hub repo.
id: '@swarmai/meeting-bridge'
version: '0.3.0'
kind: 'tool'
entry: './dist/index.js'
capabilities:
  - 'network:fetch'
  - 'fs:read'

# Surfaced to the dashboard's Hub pane so operators can fill in the
# Meeting Hub WSS endpoint + auth via the Configure button instead of
# hand-editing plugins.yaml. As of v0.2.0 only `url` is strictly required;
# authentication is satisfied by ANY of:
#   - token (pre-issued, legacy explicit-provisioning path), OR
#   - bootstrapSecret (zero-touch enrollment), OR
#   - env var SWARMAI_HUB_BOOTSTRAP_SECRET (org-wide deploy path).
configSchema:
  title: 'SwarmAI Meeting Hub'
  description: >-
    Connect this CEO Agent to a SwarmAI Meeting Hub so external guests
    can join meetings as human-external attendees in Athena's
    MeetingRegistry.
  required: [url]
  properties:
    url:
      type: string
      title: 'Hub WebSocket URL'
      description: 'The wss:// (or ws://) endpoint of your Meeting Hub.'
      format: uri
      examples: ['wss://meeting.northpeak.app/bridge']
    token:
      type: string
      title: 'Bridge token (optional)'
      description: >-
        Pre-issued bridge token from POST /admin/tenants. Skip when using
        bootstrap-secret enrollment.
      format: password
    bootstrapSecret:
      type: string
      title: 'Bootstrap secret (optional)'
      description: >-
        Shared bootstrap secret for POST /bridge/enroll. On first start with
        no stored token, plugin POSTs this + the installation UUID to the
        Hub and receives an auto-issued tenant + token.
      format: password
    expectedTenantSlug:
      type: string
      title: 'Expected tenant slug (exact match)'
      description: >-
        When set, the bridge refuses to connect if the Hub reports a
        different tenant — guards against pairing with the wrong instance.
    expectedTenantSlugPrefix:
      type: string
      title: 'Expected tenant slug prefix'
      description: >-
        For auto-enrolled tenants whose slug follows the `<hostname>-<short-id>`
        pattern — set this to your org marker (e.g. "acmecorp-").
    artefactSizeLimitMb:
      type: number
      title: 'Artefact size limit (MB)'
      description: 'Max payload size for fetched artefacts.'
      default: 50
